lang: es

csl: vancouver-apa-hybrid.csl
link-citations: true

crossref:
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  chapters: true

format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    reference-location: block
    logo: cover.png
    css:
      - custom.css
      - pdf-styles.css
    include-in-header:
      - caption-bold.html
      - text: |
          <meta name="citation_book_title" content="Investigaciones en Gestión del Riesgo de Desastres para Colombia. Enfoque Comunitario, Territorial y Animal">
          <meta name="citation_publisher" content="Unidad Nacional para la Gestión del Riesgo de Desastres - UNGRD">
          <meta name="citation_publication_date" content="2025/12/03">
          <meta name="citation_online_date" content="2025/12/03">
          <meta name="citation_language" content="es">
          <meta name="citation_pdf_url" content="https://scr-ungrd.github.io/investigaciones-grd-2025/Investigaciones-en-Gesti%C3%B3n-del-Riesgo-de-Desastres-para-Colombia.-Enfoque-Comunitario,-Territorial-y-Animal.pdf">
          <meta name="robots" content="index, follow">
    html-math-method: katex
  pdf:
    documentclass: book
    geometry: margin=1in
    keep-tex: true
    prefer-html: true
    number-sections: true
    top-level-division: chapter
    shift-heading-level-by: -1
    include-in-header:
      - text: |
          \usepackage{makeidx}
          \makeindex
          \AtBeginDocument{\hypersetup{
            pdftitle={Investigaciones en Gestión del Riesgo de Desastres para Colombia. Enfoque Comunitario, Territorial y Animal},
            pdfauthor={Comisión Nacional Asesora para la Investigación en Gestión del Riesgo de Desastres},
            pdfsubject={Gestión del Riesgo de Desastres, Colombia},
            pdfkeywords={gestión del riesgo de desastres; resiliencia comunitaria; cartografía participativa; etnodiferencial; riesgo volcánico; animales de producción; Colombia}
          }}
    include-after-body:
      - text: |
          \clearpage
          \phantomsection
          \addcontentsline{toc}{chapter}{Índice Temático}
          \printindex

